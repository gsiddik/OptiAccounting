# OptiEntry: PostgreSQL, Redis, one-shot bootstrap job, API (php-fpm + nginx), queue worker, scheduler and the console (SPA behind nginx).
# MongoDB is intentionally absent until OA7 justifies analytical projections.
#
# Two kinds of settings, kept apart on purpose:
#   * the root .env is read by Compose for ${...} interpolation only (copy .env.example; never commit it);
#   * the runtime environment of the containers is exactly the `environment:` blocks below, identical for every PHP role (x-entry-env),
#     so a changed secret needs `docker compose up -d` (containers re-created), never an image rebuild.
# Only the `bootstrap` job migrates. api, worker and scheduler wait for it (service_completed_successfully, and the entrypoint also
# waits for a current schema) and never touch the schema themselves.
# The project name and the volume keys below are unchanged since the OptiAccounting days so existing installations keep their data.
name: optiaccounting

x-entry-env: &entry-env
  APP_NAME: OptiEntry
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?set APP_KEY in .env (see .env.example)}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${ENTRY_PUBLIC_URL:-http://localhost:5190}
  FRONTEND_URL: ${ENTRY_PUBLIC_URL:-http://localhost:5190}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  # Database identifiers keep the former product name (OptiAccounting) so existing installations keep their data.
  DB_DATABASE: ${DB_DATABASE:-optiaccounting}
  DB_USERNAME: ${DB_USERNAME:-optiaccounting}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (an existing installation keeps the password already in use)}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  LOG_CHANNEL: stderr
  OPTIENTRY_IDENTITY_MODE: ${OPTIENTRY_IDENTITY_MODE:-${OPTIACCOUNTING_IDENTITY_MODE:-standalone}}
  OPTIENTRY_DEMO_PASSWORD: ${OPTIENTRY_DEMO_PASSWORD:-}
  # OptiNexus adapter: read only when OPTIENTRY_IDENTITY_MODE=optinexus. The OIDC redirect is the console origin + /api/v1/auth/sso/callback
  # (the console proxies /api to the API), so it is registered once and never contains an internal host name.
  OPTINEXUS_BASE_URL: ${OPTINEXUS_BASE_URL:-}
  OPTINEXUS_APPLICATION_CODE: ${OPTINEXUS_APPLICATION_CODE:-optiaccounting}
  OPTINEXUS_SSO_CLIENT_ID: ${OPTINEXUS_SSO_CLIENT_ID:-}
  OPTINEXUS_SSO_CLIENT_SECRET: ${OPTINEXUS_SSO_CLIENT_SECRET:-}
  OPTINEXUS_SSO_REDIRECT_URI: ${ENTRY_PUBLIC_URL:-http://localhost:5190}/api/v1/auth/sso/callback
  OPTINEXUS_SSO_FRONTEND_URL: ${ENTRY_PUBLIC_URL:-http://localhost:5190}
  OPTINEXUS_SERVICE_CLIENT_ID: ${OPTINEXUS_SERVICE_CLIENT_ID:-}
  OPTINEXUS_SERVICE_CLIENT_SECRET: ${OPTINEXUS_SERVICE_CLIENT_SECRET:-}
  OPTINEXUS_BREAK_GLASS_LOGIN: ${OPTINEXUS_BREAK_GLASS_LOGIN:-true}
  OPTINEXUS_PROVISION_TENANTS: ${OPTINEXUS_PROVISION_TENANTS:-true}
  OPTINEXUS_PERMISSION_TTL: ${OPTINEXUS_PERMISSION_TTL:-300}
  OPTINEXUS_ENTITLEMENT_TTL: ${OPTINEXUS_ENTITLEMENT_TTL:-300}
  OPTINEXUS_TIMEOUT: ${OPTINEXUS_TIMEOUT:-15}

x-php: &php
  image: ${ENTRY_IMAGE:-optientry-backend:local}
  restart: unless-stopped
  environment: *entry-env
  volumes:
    - entry_storage:/var/www/html/storage/app

x-after-bootstrap: &after-bootstrap
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  bootstrap:
    condition: service_completed_successfully

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-optiaccounting}
      POSTGRES_USER: ${DB_USERNAME:-optiaccounting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - optiaccounting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-optiaccounting} -d ${DB_DATABASE:-optiaccounting}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    <<: *php
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-alpine}
        COMPOSER_INSTALL_FLAGS: ${COMPOSER_INSTALL_FLAGS:---prefer-dist}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bootstrap"]

  api:
    <<: *php
    depends_on: *after-bootstrap
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *php
    depends_on: *after-bootstrap
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]

  scheduler:
    <<: *php
    depends_on: *after-bootstrap
    command: ["php", "artisan", "schedule:work"]

  web:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_HOST: api
      LISTEN_PORT: ${ENTRY_API_PORT:-8200}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-20m}
    volumes:
      - ./docker/nginx/api.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ENTRY_API_PORT:-8200}:${ENTRY_API_PORT:-8200}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${ENTRY_API_PORT:-8200}/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ui:
    image: ${ENTRY_UI_IMAGE:-optientry-ui:local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      LISTEN_PORT: ${ENTRY_UI_PORT:-5190}
      API_UPSTREAM: http://web:${ENTRY_API_PORT:-8200}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ENTRY_UI_PORT:-5190}:${ENTRY_UI_PORT:-5190}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${ENTRY_UI_PORT:-5190}/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Development only (docker compose --profile dev up ui-dev): Vite dev server with hot reload, API proxied to `web`.
  ui-dev:
    profiles: ["dev"]
    image: ${NODE_IMAGE:-node:22-alpine}
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_DEV_API_PROXY: http://web:${ENTRY_API_PORT:-8200}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ENTRY_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - optiaccounting_frontend_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_healthy

volumes:
  optiaccounting_postgres_data:
  optiaccounting_frontend_node_modules:
  entry_storage:
